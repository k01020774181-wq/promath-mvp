services:
  api:
    build: .
    restart: unless-stopped
    volumes:
      - platform_data:/data
    networks: [platform]
  proxy:
    image: caddy:2
    restart: unless-stopped
    environment:
      PROMATH_DOMAIN: ${PROMATH_DOMAIN:?Set your domain in .env}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [platform]
networks:
  platform:
volumes:
  platform_data:
  caddy_data:
